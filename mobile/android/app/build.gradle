plugins { id 'com.android.application' }
android {
    namespace 'nl.kwast.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.kwast.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }
    sourceSets.main.assets.srcDirs = ['../../../dist']
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

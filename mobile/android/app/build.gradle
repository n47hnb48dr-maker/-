plugins { id 'com.android.application' }
android {
    namespace 'nl.kwast.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.kwast.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
        // Release builds talk to the server over HTTPS only.
        manifestPlaceholders = [cleartext: 'false']
    }
    buildTypes {
        // Debug builds may reach a pilot server on the local network over plain HTTP (e.g. http://192.168.1.20:8080).
        debug { manifestPlaceholders = [cleartext: 'true'] }
    }
    sourceSets.main.assets.srcDirs = ['../../../dist']
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
